teName="y" from="340" to="155" dur="0.9s" begin="0.56s" fill="freeze"/><animate attributeName="height" from="0" to="185" dur="0.9s" begin="0.56s" fill="freeze"/></rect><rect x="1168" y="340" width="22" height="0" rx="5" fill="#ffc59e" fill-opacity="0.65"><animate attributeName="y" from="340" to="165" dur="0.9s" begin="0.64s" fill="freeze"/><animate attributeName="height" from="0" to="175" dur="0.9s" begin="0.64s" fill="freeze"/></rect><rect x="1204" y="340" width="22" height="0" rx="5" fill="#ff8a3d" fill-opacity="1"><animate attributeName="y" from="340" to="120" dur="0.9s" begin="0.72s" fill="freeze"/><animate attributeName="height" from="0" to="220" dur="0.9s" begin="0.72s" fill="freeze"/></rect><rect x="1150" y="80" width="98" height="26" rx="13" fill="#1a1006" stroke="#ff8a3d" stroke-opacity="0.7"/>
